<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Rush · Jouer</title>
<link rel="icon" href="/assets/robots/robot-bleue-normal.svg">
<link rel="stylesheet" href="/fonts/polices.css?v=3">
<link rel="stylesheet" href="/css/commun.css?v=3">
<link rel="stylesheet" href="/css/jouer.css?v=4">
</head>
<body>

<!-- B1 · Connexion -->
<main id="ecran-connexion" hidden>
  <form class="carte-connexion" id="form-connexion" autocomplete="off">
    <div class="titre-connexion"><span id="robot-connexion"></span><span>Robot Rush</span></div>
    <div class="groupe">
      <label for="c0">Code de ton équipe</label>
      <div class="cases-code">
        <input id="c0" class="case" maxlength="4" autocapitalize="characters" spellcheck="false" aria-label="Caractère 1 du code">
        <input class="case" maxlength="4" autocapitalize="characters" spellcheck="false" aria-label="Caractère 2 du code">
        <input class="case" maxlength="4" autocapitalize="characters" spellcheck="false" aria-label="Caractère 3 du code">
        <input class="case" maxlength="4" autocapitalize="characters" spellcheck="false" aria-label="Caractère 4 du code">
      </div>
      <div id="confirmation" class="confirmation" hidden></div>
    </div>
    <div class="groupe">
      <label for="pseudo">Ton pseudo</label>
      <input id="pseudo" class="champ-pseudo" maxlength="16" placeholder="Ton prénom ou un surnom">
    </div>
    <p id="erreur-connexion" class="erreur" role="alert" hidden></p>
    <button class="bouton-noir bouton-rejoindre" type="submit">Rejoindre la course</button>
    <p class="mention">Les codes n'utilisent ni O, 0, I ni 1. Si tu actualises la page, tu retrouves ton équipe et ton pseudo.</p>
  </form>
</main>

<!-- Jeu -->
<div id="ecran-jeu" hidden>
  <header class="bandeau" id="bandeau">
    <section class="bloc bloc-equipe" id="bloc-equipe" aria-live="polite"></section>
    <section class="bloc bloc-piste" id="mini-piste" aria-label="Positions des équipes"></section>
    <section class="bloc bloc-stock"><span class="petit-titre">Stock de l'équipe</span><div class="grille-stock" id="stock"></div></section>
    <section class="bloc bloc-fil"><span class="petit-titre">Dernières actions</span><div id="fil"></div></section>
  </header>
  <main class="zone" id="zone"></main>
</div>

<div id="voile-pause" class="voile" hidden><div class="voile-carte">Pause</div><p>Le professeur a mis la course en pause.</p></div>
<div id="hors-ligne" class="hors-ligne" hidden>Connexion perdue… reconnexion en cours</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/commun.js?v=3"></script>
<script src="/js/blocs.js?v=4"></script>
<script src="/js/questions.js?v=7"></script>
<script src="/js/jouer.js?v=4"></script>
</body>
</html>
