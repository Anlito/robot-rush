<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Rush · Course</title>
<link rel="icon" href="/assets/robots/robot-rouge-normal.svg">
<link rel="stylesheet" href="/fonts/polices.css?v=3">
<link rel="stylesheet" href="/css/commun.css?v=3">
<link rel="stylesheet" href="/css/course.css?v=7">
</head>
<body>
<div id="scene">
  <!-- Barre du haut (A1, A2) -->
  <header class="barre" id="barre">
    <div class="marque"><span id="logo"></span>
      <div class="marque-textes"><span class="nom-jeu">Robot Rush</span><span class="nom-parcours" id="nom-parcours"></span></div></div>
    <div class="chrono" id="chrono">--:--</div>
    <div class="rejoindre">
      <div class="rejoindre-textes"><span class="gris">Rejoindre</span><b class="mono" id="adresse"></b></div>
      <img class="qr-petit" src="/qr.svg" alt="QR code de l'adresse élèves" id="qr-barre">
    </div>
  </header>

  <!-- A3 · Avant la partie -->
  <section id="vue-lobby" class="vue" hidden>
    <div class="lobby-tete">
      <div class="lobby-titres">
        <span class="lobby-titre">Rejoins ton équipe</span>
        <span class="lobby-sous">Va sur <b class="url mono" id="adresse-lobby"></b> et tape le code.</span>
        <span class="lobby-courte" id="adresse-autres"></span>
      </div>
      <img class="qr-grand" src="/qr.svg" alt="QR code de l'adresse élèves" id="qr-lobby">
      <div class="connectes"><span id="nb-connectes">0</span><span class="gris">élèves connectés</span></div>
    </div>
    <div class="cartes-codes" id="cartes-codes"></div>
  </section>

  <!-- A1 / A2 · Course -->
  <section id="vue-course" class="vue" hidden>
    <div class="couloirs" id="couloirs"></div>
    <aside class="colonne">
      <div class="carte" id="carte-classement"><div class="carte-titre">Classement</div><div id="classement"></div></div>
      <div class="carte carte-fil"><div class="carte-titre">En direct</div><div id="fil"></div></div>
    </aside>
  </section>

  <!-- A4 · Fin de partie -->
  <section id="vue-fin" class="vue" hidden>
    <div class="fin-gauche">
      <div class="fin-titres"><span class="gris fin-sous" id="fin-sous"></span><span class="fin-titre" id="fin-titre"></span></div>
      <div class="podium" id="podium"></div>
      <div class="suivants" id="suivants"></div>
    </div>
    <aside class="fin-droite">
      <span class="fin-droite-titre">Meilleurs joueurs</span>
      <div class="meilleurs" id="meilleurs"></div>
    </aside>
  </section>

  <div id="voile-pause" class="voile" hidden><div class="voile-carte">Pause</div></div>
  <button class="bouton-son" id="bouton-son" type="button" title="Musique de victoire à la fin de la course"></button>
  <div id="hors-ligne" class="hors-ligne" hidden>Connexion au serveur perdue… reconnexion en cours</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/commun.js?v=3"></script>
<script src="/js/son.js?v=1"></script>
<script src="/js/course.js?v=9"></script>
</body>
</html>
